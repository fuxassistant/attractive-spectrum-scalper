<div id="price-level-memory-v1">
  <h3>Память абсолютных цен · GCZ6</h3>
  <div class="viz-controls">
    <label class="form-label">Срез времени<select class="form-select" id="plm-scene"></select></label>
    <label class="form-label">Уровень, USD/oz<select class="form-select" id="plm-level"></select></label>
    <label class="form-label" id="plm-zoom-label">Окно карты<select class="form-select" id="plm-zoom"><option value="recent">Последний час</option><option value="history">С начала наблюдения</option></select></label>
  </div>
  <div class="viz-row text-small" id="plm-meta" aria-live="polite"></div>
  <div class="plm-legend" id="plm-legend" aria-label="Показываемые серии"></div>
  <div id="plm-map"></div>
  <div class="viz-row text-small text-muted"><span class="plm-heat-swatch"></span>Заливка: время midpoint в ценовой ячейке, с</div>
  <div id="plm-centers"></div>
  <div class="text-small text-muted">История уровня с 00:00 UTC · <span id="plm-window-label">рисунок: последний час</span></div>
  <div id="plm-level-state" class="text-small tabular-nums" aria-live="polite"></div>
  <div class="table-responsive"><table class="table table-sm tabular-nums" aria-label="Наблюдённые потоки выбранного уровня"><thead><tr><th>Уровень</th><th class="text-end">Passive F</th><th class="text-end">Уменьшено без F</th><th class="text-end">Пополнено</th></tr></thead><tbody id="plm-flow"></tbody></table></div>
  <div class="text-small text-muted" id="plm-trades"></div>
  <div class="tooltip" id="plm-tooltip" role="tooltip" hidden></div>
  <script type="application/json" id="plm-data">__DATA_JSON__</script>
</div>
<style>
#price-level-memory-v1{position:relative;color:var(--foreground);width:100%;overflow-wrap:anywhere}
#price-level-memory-v1 h3{padding-right:90px}
#price-level-memory-v1 .plm-legend{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:8px 0}
#price-level-memory-v1 .plm-legend button{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--foreground);padding:0;font:inherit;font-weight:400}
#price-level-memory-v1 .plm-legend button[aria-pressed="false"]{opacity:.42}
#price-level-memory-v1 .plm-legend-swatch{width:18px;height:3px;display:inline-block}
#price-level-memory-v1 .plm-heat-swatch{display:inline-block;width:18px;height:10px;background:var(--viz-series-1);opacity:.35}
#price-level-memory-v1 .plm-chart{display:block;width:100%;overflow:visible}
#price-level-memory-v1 .plm-chart text{fill:var(--foreground);font-size:12px;font-weight:400}
#price-level-memory-v1 .plm-chart .domain,#price-level-memory-v1 .plm-chart .tick line{stroke:var(--border)}
#price-level-memory-v1 .plm-chart rect[data-chart-frame]{stroke:var(--border);stroke-width:1;fill:transparent}
#price-level-memory-v1 #plm-tooltip{position:absolute;pointer-events:none;z-index:5;max-width:min(320px,90%);background:var(--popover);color:var(--popover-foreground);border:1px solid var(--border);padding:8px}
#price-level-memory-v1 #plm-tooltip table{border-collapse:collapse;width:100%}
#price-level-memory-v1 #plm-tooltip td{padding:2px 6px 2px 0}
#price-level-memory-v1 #plm-level-state{margin:6px 0}
</style>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script>

svg.select('[data-axis="x"]').attr('x',(left+right)/2).attr('y',height-7);svg.select('[data-axis="y"]').attr('transform',`translate(16,${(top+bottom)/2}) rotate(-90)`);
heat.selectAll('rect').data(cells).join('rect').attr('data-dwell-s',h=>h[2]).attr('data-interval-end',h=>Math.min(lastClock,h[0]+step)).attr('x',h=>x(new Date(h[0]*1000))).attr('y',h=>y(h[1]+bin)).attr('width',h=>Math.max(0,x(new Date(Math.min(lastClock,h[0]+step)*1000))-x(new Date(h[0]*1000)))).attr('height',h=>Math.max(.2,y(h[1])-y(h[1]+bin))).attr('fill','var(--viz-series-1)').attr('opacity',h=>h[2]>0?.62*Math.sqrt(Math.min(1,h[2]/step)):0);

function hover(event){if(!scales)return;const s=shown(current()),[rawx,rawy]=d3.pointer(event,svg.node()),mx=Math.max(scales.left,Math.min(scales.right,rawx)),my=Math.max(scales.top,Math.min(scales.bottom,rawy)),sec=+scales.x.invert(mx)/1000;guide.attr('x1',mx).attr('x2',mx).style('display',null);const values=series.filter(item=>state.visible[item.id]).map(item=>({...item,value:valueAt(s.path,sec,item.col)}));markers.selectAll('circle').data(values.filter(v=>finite(v.value)),d=>d.id).join('circle').attr('data-chart-hover-marker','').attr('cx',mx).attr('cy',d=>scales.y(d.value)).attr('r',3.1).attr('fill',d=>d.color);tip.innerHTML='<div>'+d3.utcFormat('%H:%M:%S')(new Date(sec*1000))+' UTC</div><table>'+values.map(v=>'<tr><td>'+esc(v.name)+'</td><td class="tabular-nums">'+f(v.value,2)+'</td></tr>').join('')+'</table>';tip.hidden=false;const rootBox=root.getBoundingClientRect(),box=svg.node().getBoundingClientRect(),px=mx+box.left-rootBox.left,py=my+box.top-rootBox.top;tip.style.left=Math.max(0,Math.min(root.clientWidth-tip.offsetWidth-4,px+12))+'px';tip.style.top=Math.max(0,py-tip.offsetHeight-12)+'px';}
