[build-system]
requires = ["setuptools==78.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "attractive-spectrum-scalper"
version = "0.4.1"
description = "Causal market replay, feature families, representations and crossing banks"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.2.6", "pandas==2.2.3", "pyarrow==20.0.0", "zstandard==0.25.0", "databento-dbn==0.69.0", "numba==0.64.0", "psutil==7.0.0", "tzdata==2026.3"]

[project.optional-dependencies]
dev = ["pytest==9.0.2"]

[project.scripts]
spectrum = "spectrum.cli:main"

[tool.setuptools.packages.find]
include = ["spectrum*"]

[tool.setuptools.package-data]
"spectrum.resources" = ["*.json"]
"spectrum.core.vendor" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
