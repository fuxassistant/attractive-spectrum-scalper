name: Library tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            lock: linux
          - os: windows-2022
            lock: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: requirements/baseline-${{ matrix.lock }}-py312.lock
      - run: python -m venv .ci-venv
      - name: Use isolated baseline environment
        run: |
          if [ -d .ci-venv/Scripts ]; then
            echo "$GITHUB_WORKSPACE/.ci-venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$GITHUB_WORKSPACE/.ci-venv/bin" >> "$GITHUB_PATH"
          fi
      - run: python -m pip install --require-hashes -r requirements/baseline-${{ matrix.lock }}-py312.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pip check
      - run: python tools/baseline_environment.py --lock requirements/baseline-${{ matrix.lock }}-py312.lock
      - run: python -m pytest -q
      - run: python -m pytest -q checks
      - run: python -m spectrum families
      - run: python -m pip wheel --no-deps --no-build-isolation . -w dist
      - name: Test the installed wheel outside the checkout
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cp -r tests "$RUNNER_TEMP/spectrum-wheel-tests"
          cd "$RUNNER_TEMP"
          python -m pytest -q spectrum-wheel-tests
          python -m spectrum families
