name: Library tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python -m spectrum families
      - run: python -m pip wheel --no-deps --no-build-isolation . -w dist
      - name: Test the installed wheel outside the checkout
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cp -r tests "$RUNNER_TEMP/spectrum-wheel-tests"
          cd "$RUNNER_TEMP"
          python -m pytest -q spectrum-wheel-tests
          python -m spectrum families
